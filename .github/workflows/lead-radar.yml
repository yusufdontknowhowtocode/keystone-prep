name: lead-radar
on:
  schedule:
    - cron: "0 12,21 * * *"   # 8 AM and 5 PM ET (EDT)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run radar
        env:
          SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          SMTP_PASS: ${{ secrets.RADAR_SMTP_PASS }}
          DIGEST_TO: ${{ secrets.RADAR_DIGEST_TO }}
        run: python tools/lead-radar/radar.py --email
      - name: Save seen list
        run: |
          git config user.name "lead-radar"
          git config user.email "actions@users.noreply.github.com"
          git add tools/lead-radar/seen.json
          git diff --cached --quiet || git commit -m "lead-radar: update seen list [skip ci]"
          git push
